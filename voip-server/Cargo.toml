[package]
name = "voip-server"
version = "1.0.1"
edition = "2021"
default-run = "voip-server"

[[bin]]
name = "voip-server"
path = "src/main.rs"

[dependencies]
is_elevated = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.4"
tauri = { version = "2", features = [] }
cpal = "0.15"
mdns-sd = "0.11"
sha2 = "0.10"
sentry = "0.34"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
rodio = "0.19"
if-addrs = "0.13"

[build-dependencies]
tauri-build = { version = "2", features = [] }
